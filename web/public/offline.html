<title>darius</title>
<!-- The page the service worker shows when there is no connection and no saved page. It has no script; serve.ts allows its inline style. -->
<style>
  html { background: #15100b; color: #e2d3ae; font: 16px/1.5 system-ui, sans-serif; }
  body { display: grid; min-height: 100dvh; margin: 0; place-content: center; padding: 24px; text-align: center; }
  p { margin: 16px 0 0; }
  a { display: inline-block; min-height: 44px; margin-top: 16px; padding: 10px 20px; border: 1px solid #c8a24e; color: #e2bd66; text-decoration: none; }
  svg { margin: 0 auto; }
</style>
</head>
<body>
<svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true">
  <g stroke="#100c08" stroke-width="2" stroke-linejoin="miter">
    <path d="M16 2 30 16 22 16 16 10Z" fill="#e2d3ae"/>
    <path d="M30 16 16 30 16 22 22 16Z" fill="#c8a24e"/>
    <path d="M16 30 2 16 10 16 16 22Z" fill="#7a6142"/>
    <path d="M2 16 16 2 16 10 10 16Z" fill="#c8a24e"/>
    <path d="M16 10 22 16 16 22 10 16Z" fill="#e2bd66"/>
  </g>
</svg>
<p>No connection, and no saved page yet.</p>
<a href="/">Retry</a>
</body>
</html>
